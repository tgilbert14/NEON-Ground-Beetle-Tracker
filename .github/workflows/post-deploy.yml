name: Verify production after main publication

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ground-beetle-production-health
  cancel-in-progress: true

jobs:
  semantic_health:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the immutable publication
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Connect Cloud and verify semantic markers
        id: smoke
        env:
          # About 10 minutes in all: 45 s, then 12 attempts backing off 15, 30,
          # 45, then 60 s, which covers a Connect Cloud republish of this commit.
          SMOKE_MAX_ATTEMPTS: "12"
          SMOKE_SLEEP_BASE: "15"
          SMOKE_SLEEP_CAP: "60"
        run: |
          set -euo pipefail
          # The live ready marker must carry the digest of this exact commit; an
          # older bundle that still answers HTTP 200 fails as a stale bundle.
          digest=$(bash scripts/build_digest.sh)
          if ! [[ "$digest" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error title=No build digest::scripts/build_digest.sh printed '$digest', not 12 hex characters."
            exit 1
          fi
          export SMOKE_APP_MARKER="ground-beetle-tracker-v1 build=${digest}"
          echo "Expected live build: ${digest} (commit ${GITHUB_SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
          sleep 45
          bash scripts/post_deploy_smoke.sh \
            "Connect Cloud app=https://019ec8ff-2a4b-e0e9-871d-07a047a571d3.share.connect.posit.cloud/" \
            "GitHub Pages landing=https://tgilbert14.github.io/NEON-Ground-Beetle-Tracker/"

      - name: Open or update the production outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Ground Beetle semantic smoke failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "$title in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          body="Main publication ${GITHUB_SHA} did not pass semantic production health. Run: ${run_url}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved production outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Ground Beetle semantic smoke failed"
          number=$(gh issue list --state open --search "$title in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$number" --comment "Semantic production health recovered at ${GITHUB_SHA}. Evidence: ${run_url}"
          fi

  close_refresh_review_issue:
    # Housekeeping only: when the data-refresh review branch head is already in
    # this main commit, close its review-request issue. Independent of the health
    # check, and it never fails the run (warnings only).
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the data refresh review issue once its branch reached main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/ground-beetle-data-refresh
        run: |
          set -uo pipefail
          title="Data refresh ready for review: ground-beetle"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null) || head=""
          if [ -z "$head" ]; then
            echo "Refresh review branch $BRANCH does not exist; nothing to close." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # "identical" or "ahead" means the branch head is an ancestor of this main commit.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${head}...${GITHUB_SHA}" --jq .status 2>/dev/null) || {
            echo "::warning title=Refresh issue check skipped::Could not compare $BRANCH ($head) with $GITHUB_SHA."
            exit 0
          }
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "Refresh review branch head $head is not in main ($status); leaving the issue open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # jq variable, not a shell expansion
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty') || {
            echo "::warning title=Refresh issue not closed::Could not list issues."
            exit 0
          }
          if [ -z "$number" ]; then
            echo "Refresh branch head $head is in main; no open review issue to close." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh issue close "$number" --comment "The refresh branch head ${head} reached main in merge commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
            echo "Closed refresh review issue #$number (head $head is in $GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Refresh issue not closed::gh issue close failed for #$number."
          fi
