name: Propose NEON data refresh

# Producer -> validator -> restricted publisher. Downloads land in an empty
# staging directory; the committed known-good bundle is replaced only after the
# exact canonical site roster exists. The validator rebuilds every derived index
# and the manifest, verifies the complete candidate, and uploads immutable bytes.
# Only the final job can write, and it publishes a review PR — never main.

on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip the NEON re-pull; rebuild derived data from committed bundles"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ground-beetle-refresh
  cancel-in-progress: false

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  GBT_LIVE: "0"

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "1"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe a NEON data endpoint with the token
        if: steps.check.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.10022.001/SRER/2023-10
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

  build_candidate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
    steps:
      - name: Checkout the immutable source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false

      - name: Install build and verification dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            neonUtilities, shiny, bslib@0.11.0, bsicons, dplyr, tidyr, tibble, plotly@4.12.0,
            leaflet, DT, shinyjs, shinycssloaders, RColorBrewer, htmltools,
            ggplot2, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: ground-beetle-refresh-geo-closure-bslib-0.11.0-v2
          install-pandoc: "false"
          install-quarto: "false"

      - name: Run scientific helper contracts before network fetch
        run: Rscript --vanilla scripts/test_helpers.R

      - name: Build the full site bundle in an empty staging directory
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          GBT_SITE_OUT_DIR: ${{ runner.temp }}/ground-beetle-sites
          GBT_REFRESH_BUILD_ONLY: "1"
        run: |
          set -euo pipefail
          mkdir -p "$GBT_SITE_OUT_DIR"
          Rscript --vanilla scripts/refresh_data.R

      - name: Promote the complete staged roster into the worktree
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          GBT_SITE_OUT_DIR: ${{ runner.temp }}/ground-beetle-sites
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds
          cp -- "$GBT_SITE_OUT_DIR"/*.rds data/sites/

      - name: Rebuild derived indexes
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/precompute.R
          Rscript --vanilla scripts/build_search_index.R
          cp data/search_index.rds "$RUNNER_TEMP/search-index-first.rds"
          Rscript --vanilla scripts/build_search_index.R
          cmp --silent "$RUNNER_TEMP/search-index-first.rds" data/search_index.rds

      - name: Regenerate the deploy manifest
        run: Rscript --vanilla scripts/write_manifest.R

      - name: Verify the complete release candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/verify_bundle.R
          Rscript --vanilla -e 'Sys.setenv(GBT_LIVE="0"); source("global.R"); source("ui.R"); server_candidate <- source("server.R")$value; stopifnot(inherits(ui, "shiny.tag.list") || inherits(ui, "shiny.tag"), is.function(server_candidate))'
          node scripts/check_custom_message_handlers.mjs
          node scripts/check_cover.mjs
          node scripts/check_shell_contracts.mjs
          bash -n scripts/post_deploy_smoke.sh
          git diff --check

      - name: Package the immutable validated candidate
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/ground-beetle-refresh.tgz" data manifest.json

      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ground-beetle-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/ground-beetle-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, build_candidate]
    if: needs.gate.outputs.run == 'true' && needs.build_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the validated source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ground-beetle-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/refresh-candidate

      - name: Publish or update the review branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Producer revision does not contain current main; refusing stale publication."
            exit 1
          fi
          [[ -d data && ! -L data ]]
          find data -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/refresh-candidate/ground-beetle-refresh.tgz"
          if git diff --quiet -- data manifest.json; then
            echo "No validated data change; no review branch created."
            exit 0
          fi
          branch="automation/ground-beetle-data-refresh"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A data manifest.json
          git commit -m "data: propose validated ground-beetle refresh [bot]" \
                     -m "Produced from ${GITHUB_SHA}; opportunity-complete site roster, helper contracts, indexes, manifest, and offline app source passed before publication."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [ -n "$remote_head" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" \
              origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi
          pushed_commit=""
          for attempt in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi

          pr_count=$(gh pr list --head "$branch" --base main --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open main PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            {
              echo "### Validated Ground Beetle review branch ready"
              echo "- Branch: \`$branch\`"
              echo "- Exact head: \`$published_commit\`"
              echo "- Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- [Open the reviewer-authenticated PR]($compare_url)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to main after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            exit 0
          fi

          pr_record=""
          for attempt in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base main --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != main || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match main <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."
