name: Propose NEON data refresh

# Producer -> validator -> restricted publisher. Downloads land in an empty
# staging directory; the committed known-good bundle is replaced only after the
# exact canonical site roster exists. The validator rebuilds every derived index
# and the manifest, verifies the complete candidate, and uploads immutable bytes.
# Only the final job can write: it pushes automation/ground-beetle-data-refresh,
# never main, and never opens its own PR (a reviewer opens it from the compare URL).
#
# Public repo: GitHub disables this schedule after 60 days without repository activity; a merged commit re-arms it. The keepalive job is a trial guard.

on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip the NEON re-pull; rebuild derived data from committed bundles"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ground-beetle-refresh
  cancel-in-progress: false

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  GBT_LIVE: "0"
  # Pinned NEON release for DP1.10022.001. Bumping this value in a reviewed PR is
  # the only way to adopt a new NEON release; release_watch warns when one is out.
  GBT_RELEASE: "RELEASE-2026"

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "1"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe a NEON data endpoint with the token
        if: steps.check.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.10022.001/SRER/2023-10
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

  build_candidate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout the immutable source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false

      - name: Install build and verification dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            neonUtilities, shiny, bslib@0.11.0, bsicons, dplyr, tidyr, tibble, plotly@4.12.0,
            leaflet, DT, shinyjs, shinycssloaders, RColorBrewer, htmltools,
            ggplot2, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: ground-beetle-refresh-geo-closure-bslib-0.11.0-v2
          install-pandoc: "false"
          install-quarto: "false"

      - name: Run scientific helper contracts before network fetch
        run: Rscript --vanilla scripts/test_helpers.R

      - name: Build the full site bundle in an empty staging directory
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          GBT_SITE_OUT_DIR: ${{ runner.temp }}/ground-beetle-sites
          GBT_REFRESH_BUILD_ONLY: "1"
        run: |
          set -euo pipefail
          mkdir -p "$GBT_SITE_OUT_DIR"
          Rscript --vanilla scripts/refresh_data.R

      - name: Promote the complete staged roster into the worktree
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          GBT_SITE_OUT_DIR: ${{ runner.temp }}/ground-beetle-sites
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds
          cp -- "$GBT_SITE_OUT_DIR"/*.rds data/sites/

      - name: Record the pinned NEON release (anonymous product endpoint, no token)
        # A skip run keeps the committed bundles, so it must not stamp a newly
        # bumped GBT_RELEASE onto old data.
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: Rscript --vanilla scripts/record_release.R

      - name: Sync environmental overlays from the Small Mammal Tracker
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          SMALL_MAMMAL_REPO: https://github.com/tgilbert14/NEON-Small-Mammal-Tracker-App.git
        run: |
          # data/env/<SITE>.rds is shared with the Small Mammal Tracker. Copy a
          # site's file only when it keeps exactly the committed column names and
          # types; otherwise keep the committed file and warn, naming the site.
          set -euo pipefail
          src="$RUNNER_TEMP/small-mammal-tracker"
          rm -rf "$src"
          git clone --depth 1 --quiet "$SMALL_MAMMAL_REPO" "$src"
          # shellcheck disable=SC2016 # R code, not shell expansions
          GBT_ENV_SRC="$src/data/env" Rscript --vanilla -e '
            src <- Sys.getenv("GBT_ENV_SRC")
            roster <- sort(sub("[.]rds$", "", list.files("data/sites", pattern = "[.]rds$")))
            sig <- function(x) if (is.data.frame(x)) paste(names(x), vapply(x, function(col) class(col)[1], ""), sep = ":") else NA_character_
            committed <- list.files("data/env", pattern = "[.]rds$", full.names = TRUE)
            shared <- unique(lapply(committed, function(f) sig(readRDS(f))))
            copied <- 0L
            for (site in roster) {
              from <- file.path(src, paste0(site, ".rds"))
              to <- file.path("data/env", paste0(site, ".rds"))
              if (!file.exists(from)) {
                cat(sprintf("::warning title=Env overlay kept::%s has no data/env file upstream; keeping ours.\n", site))
                next
              }
              want <- if (file.exists(to)) sig(readRDS(to)) else if (length(shared) == 1L) shared[[1]] else NA_character_
              cand <- tryCatch(readRDS(from), error = function(e) NULL)
              ok <- !anyNA(want) && !is.null(cand) && identical(sig(cand), want) &&
                nrow(cand) > 0L && all(as.character(cand$siteID) == site)
              if (!ok) {
                cat(sprintf("::warning title=Env overlay kept::%s upstream file does not match our committed columns and types (or siteID); keeping ours.\n", site))
                next
              }
              stopifnot(file.copy(from, to, overwrite = TRUE))
              copied <- copied + 1L
            }
            cat(sprintf("Env overlay sync: copied %d of %d roster sites from the Small Mammal Tracker.\n", copied, length(roster)),
                file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          '

      - name: Rebuild derived indexes
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/precompute.R
          Rscript --vanilla scripts/build_search_index.R
          cp data/search_index.rds "$RUNNER_TEMP/search-index-first.rds"
          Rscript --vanilla scripts/build_search_index.R
          cmp --silent "$RUNNER_TEMP/search-index-first.rds" data/search_index.rds

      - name: Regenerate the deploy manifest
        run: Rscript --vanilla scripts/write_manifest.R

      - name: Verify the complete release candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/verify_bundle.R
          Rscript --vanilla -e 'Sys.setenv(GBT_LIVE="0"); source("global.R"); source("ui.R"); server_candidate <- source("server.R")$value; stopifnot(inherits(ui, "shiny.tag.list") || inherits(ui, "shiny.tag"), is.function(server_candidate))'
          node scripts/check_custom_message_handlers.mjs
          node scripts/check_cover.mjs
          node scripts/check_shell_contracts.mjs
          bash -n scripts/post_deploy_smoke.sh
          git diff --check

      - name: Package the immutable validated candidate
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/ground-beetle-refresh.tgz" data manifest.json

      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ground-beetle-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/ground-beetle-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, build_candidate]
    if: needs.gate.outputs.run == 'true' && needs.build_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout the validated source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ground-beetle-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/refresh-candidate

      - name: Publish or update the review branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Producer revision does not contain current main; refusing stale publication."
            exit 1
          fi
          candidate="$RUNNER_TEMP/refresh-candidate/ground-beetle-refresh.tgz"
          # Every member must be manifest.json or under data/: no absolute paths
          # and no ".." segments, checked before anything is extracted.
          members=$(tar -tzf "$candidate")
          if [ -z "$members" ]; then
            echo "Candidate tarball lists no members; refusing publication."
            exit 1
          fi
          while IFS= read -r member; do
            case "$member" in
              /*|..|../*|*/../*|*/..)
                echo "Candidate member has an absolute or parent path: $member"; exit 1 ;;
              manifest.json|data/*) ;;
              *)
                echo "Candidate member is outside data/ and manifest.json: $member"; exit 1 ;;
            esac
          done <<< "$members"
          [[ -d data && ! -L data ]]
          find data -mindepth 1 -delete
          tar -xzf "$candidate"
          # Stage first so a new untracked bundle (for example a new site) counts.
          git add -A -- data manifest.json
          if git diff --cached --quiet; then
            echo "No validated data change; no review branch created."
            exit 0
          fi
          branch="automation/ground-beetle-data-refresh"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A data manifest.json
          git commit -m "data: propose validated ground-beetle refresh [bot]" \
                     -m "Produced from ${GITHUB_SHA}; opportunity-complete site roster, helper contracts, indexes, manifest, and offline app source passed before publication."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [ -n "$remote_head" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" \
              origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi
          pushed_commit=""
          for attempt in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi

          pr_count=$(gh pr list --head "$branch" --base main --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open main PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            {
              echo "### Validated Ground Beetle review branch ready"
              echo "- Branch: \`$branch\`"
              echo "- Exact head: \`$published_commit\`"
              echo "- Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- [Open the reviewer-authenticated PR]($compare_url)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to main after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            # One review-request issue, never duplicated: update it when it exists.
            issue_title="Data refresh ready for review: ground-beetle"
            # shellcheck disable=SC2016 # literal Markdown backticks and jq variables
            issue_body=$(printf '%s\n\n- Compare and open the PR: %s\n- Exact head: `%s`\n- Validator run: %s\n' \
              "A validated ground-beetle data refresh is on \`$branch\`. Review it, then open a reviewer-authenticated PR to main." \
              "$compare_url" "$published_commit" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
            issue_number=$(gh issue list --state open --search "\"$issue_title\" in:title" --json number,title \
              | jq -r --arg t "$issue_title" '[.[] | select(.title == $t)][0].number // empty')
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --body "$issue_body"
              gh issue comment "$issue_number" --body "Updated to exact head \`$published_commit\` by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            else
              gh issue create --title "$issue_title" --body "$issue_body"
            fi
            exit 0
          fi

          pr_record=""
          for attempt in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base main --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != main || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match main <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."

  keepalive:
    # Trial keepalive: re-enabling an already enabled workflow is meant to keep the
    # 60-day inactivity clock from disabling the schedule. It cannot revive a
    # schedule that GitHub has already disabled; only a merged commit or a manual
    # enable does that. Independent of the gate; it never fails the run.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Report workflow state and re-enable the schedule (trial)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-data.yml" --jq .state 2>/dev/null) || state="unknown"
          echo "Refresh workflow state before keepalive: ${state:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-data.yml/enable" >/dev/null 2>&1; then
            echo "Trial keepalive: enable call accepted." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Keepalive call failed::The trial enable call for refresh-data.yml did not succeed; the schedule still re-arms on the next merged commit."
            echo "Trial keepalive: enable call failed (warning only)." >> "$GITHUB_STEP_SUMMARY"
          fi

  release_watch:
    # Anonymous NEON product metadata only; no NEON token is mapped here. A network
    # or parse failure is a warning, never a failed run.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Compare NEON releases and change logs with the pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRODUCT_URL: https://data.neonscience.org/api/v0/products/DP1.10022.001
        run: |
          set -uo pipefail
          meta=$(mktemp)
          if ! curl -sS --fail --retry 3 --retry-all-errors --max-time 60 -o "$meta" "$PRODUCT_URL" \
               || ! jq -e '.data.releases | length > 0' "$meta" >/dev/null 2>&1; then
            echo "::warning title=NEON release watch skipped::Could not read $PRODUCT_URL; no release or change-log verdict this run."
            echo "NEON release watch: product metadata unavailable; skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Every NEON field written to the summary or issue has CR and LF
          # stripped, and only a ^RELEASE-[0-9]{4}$ tag counts as a release.
          newest=$(jq -r '[.data.releases[].release | strings | select(test("\\ARELEASE-[0-9]{4}\\z"))] | sort | last // empty' "$meta" | tr -d '\r\n')
          if ! [[ "$newest" =~ ^RELEASE-[0-9]{4}$ ]]; then
            newest=""
          fi
          pinned_date=$(jq -r --arg r "$GBT_RELEASE" '[.data.releases[] | select(.release == $r) | .generationDate][0] // empty' "$meta" | tr -d '\r\n')
          new_release=""
          if [ -n "$newest" ] && [ "$newest" != "$GBT_RELEASE" ]; then
            new_release="$newest"
            echo "::warning title=New NEON release::NEON $newest is out; bump GBT_RELEASE after review"
          fi
          if [ -z "$pinned_date" ]; then
            echo "::warning title=Pinned release not listed::$GBT_RELEASE is not in the product release list; change logs are not filtered."
            pinned_date="0000"
          fi
          changes=$(jq -r --arg d "$pinned_date" '
            def clean: tostring | gsub("[\\r\\n]+"; " ") | gsub("\\|"; "/");
            [.data.changeLogs[]? | select((.issueDate // "") > $d)]
            | sort_by(.issueDate)[]
            | "| \((.id // "") | clean) | \((.issueDate // "") | clean) | \((.locationAffected // "") | clean) | \((.issue // "") | clean | .[0:140]) |"' "$meta" | tr -d '\r')
          {
            echo "### NEON release watch: DP1.10022.001"
            echo "- Pinned release: \`$GBT_RELEASE\` (generated ${pinned_date})"
            echo "- Newest RELEASE tag: \`${newest:-none}\`"
            if [ -n "$changes" ]; then
              echo ""
              echo "Change-log entries issued after the pinned release:"
              echo ""
              echo "| id | issueDate | locationAffected | issue (first 140 chars) |"
              echo "| --- | --- | --- | --- |"
              echo "$changes"
            else
              echo "- No change-log entries issued after the pinned release."
            fi
          } > "$RUNNER_TEMP/release-watch.md"
          cat "$RUNNER_TEMP/release-watch.md" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$meta"
          if [ -z "$new_release" ] && [ -z "$changes" ]; then
            exit 0
          fi
          title="NEON release or change log needs review: ground-beetle"
          body=$(cat "$RUNNER_TEMP/release-watch.md")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty') || {
            echo "::warning title=Release watch issue not updated::Could not list issues."; exit 0; }
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body" \
              || echo "::warning title=Release watch issue not created::gh issue create failed."
          else
            current=$(gh issue view "$number" --json body --jq .body 2>/dev/null) || current=""
            if [ "$current" != "$body" ]; then
              gh issue edit "$number" --body "$body" \
                && gh issue comment "$number" --body "Release watch content changed. Run: $run_url" \
                || echo "::warning title=Release watch issue not updated::gh issue edit failed."
            else
              echo "Release watch issue #$number is already current." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
